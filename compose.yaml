services:
  app:
    build: .
    ports:
      - "127.0.0.1:${DINOMAPS_PORT:-8000}:8000"
    environment: &app-environment
      COMPOSER_ALLOW_SUPERUSER: "1"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DINOMAPS_DB_NAME:-dinomaps}
      DB_USERNAME: ${DINOMAPS_DB_USER:-dinomaps}
      DB_PASSWORD: ${DINOMAPS_DB_PASSWORD:-dinomaps-local}
    volumes:
      - .:/app
      - vendor:/app/vendor
      - bootstrap-cache:/app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        composer install --no-interaction
        if ! grep -q '^APP_KEY=base64:.' .env; then php artisan key:generate --force; fi
        php artisan migrate --force
        # Keep Docker environment variables in the web server process.
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
  scheduler:
    build: .
    environment: *app-environment
    volumes:
      - .:/app
      - vendor:/app/vendor
      - bootstrap-cache:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
  db:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DINOMAPS_DB_NAME:-dinomaps}
      MARIADB_USER: ${DINOMAPS_DB_USER:-dinomaps}
      MARIADB_PASSWORD: ${DINOMAPS_DB_PASSWORD:-dinomaps-local}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  vendor:
  bootstrap-cache:
  db-data:
