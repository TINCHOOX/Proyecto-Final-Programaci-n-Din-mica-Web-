name: dinomaps-demo

services:
  app:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
      DINOMAPS_DEMO_PROXY: "true"
      COMPOSER_ALLOW_SUPERUSER: "1"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: dinomaps_demo
      DB_USERNAME: dinomaps_demo
      DB_PASSWORD: dinomaps-demo-internal
    volumes:
      - .:/app:ro
      - ./.env.example:/app/.env:ro
      - vendor:/app/vendor
      - bootstrap-cache:/app/bootstrap/cache
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
        if [ ! -s storage/demo-key ]; then
          umask 077
          php -r 'echo "base64:".base64_encode(random_bytes(32));' > storage/demo-key
          umask 022
        fi
        export APP_KEY="$$(cat storage/demo-key)"
        composer install --no-dev --no-interaction
        php artisan migrate --seed --force
        php artisan schedule:work &
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 90s
  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: dinomaps_demo
      MARIADB_USER: dinomaps_demo
      MARIADB_PASSWORD: dinomaps-demo-internal
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 15
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8000"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  vendor:
  bootstrap-cache:
  storage:
  db-data:
